name: build-all-apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-all-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-frontend-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin app
        run: pnpm --dir apps/admin build

      - name: Build checkout app
        run: pnpm --dir apps/checkout build

      - name: Build customer portal app
        run: pnpm --dir apps/customer build

      - name: Build invoice app
        run: pnpm --dir apps/invoice build

  build-docker-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-api
            target: admin-api
            image: railzway-admin-api
          - name: admin-all-in-one
            target: admin-all-in-one
            image: railzway-admin-all-in-one
          - name: scheduler
            target: scheduler
            image: railzway-scheduler
          - name: api
            target: api
            image: railzway-api
          - name: migrate
            target: migrate
            image: railzway-migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Normalize registry owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
