name: build-all-apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-all-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin app
        run: pnpm --dir apps/admin build

      - name: Build checkout app
        run: pnpm --dir apps/checkout build

      - name: Build customer portal app
        run: pnpm --dir apps/customer build

      - name: Build invoice app
        run: pnpm --dir apps/invoice build

  build-docker-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build admin image target
        run: docker buildx build --load --target admin -t railzway-admin:ci .

      - name: Build scheduler image target
        run: docker buildx build --load --target scheduler -t railzway-scheduler:ci .

      - name: Build api image target
        run: docker buildx build --load --target api -t railzway-api:ci .
