name: Bug Report
description: Report a defect or regression
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A short, factual summary of the problem.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - admin-ui
        - admin-api
        - admin-all-in-one
        - public-api
        - customer-portal
        - checkout
        - invoice
        - scheduler
        - rating
        - subscriptions
        - metering
        - ledger
        - migrations
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: List the shortest sequence that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Create ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs, stack traces, or screenshots.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Go/Node version, deployment mode, and any relevant config context.
      placeholder: Local macOS, Go 1.25.1, Node 22, docker compose, admin binary
